<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caregiver Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <style>
      body.signup-page {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .signup-container {
        width: min(100%, 420px);
        margin: 0 auto;
        text-align: center;
      }

      .signup-form .signup-input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem;
        margin: 0.5rem 0;
        border-radius: 6px;
        border: 1px solid #ccc;
        font: inherit;
      }

      .signup-form .signup-submit {
        display: inline-block;
        min-width: 120px;
        text-align: center;
        margin: 0.25rem;
        transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease, color 150ms ease;
        color: #ffffff !important;
        background-color: rgb(155, 80, 226);
        border: 1px solid #8b9aa9;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(5,8,12,0.4);
        cursor: pointer;
        font: inherit;
        text-decoration: none;
        line-height: normal;
        appearance: none;
        -webkit-appearance: none;
      }

      .signup-form .signup-submit:hover {
        transform: translateY(-4px);
        background-color: #4b5e6c;
        border-color: #394c56;
        box-shadow: 0 10px 28px rgba(5,8,12,0.6);
        color: #ffffff !important;
      }
    </style>
  </head>
  <body class="signup-page">
    {% for message in get_flashed_messages() %}
    <div class="error">There was an error: {{ message }}</div>
    {% endfor %}
    <div class="signup-container">
      <h2>Caregiver Sign Up</h2>
      <form method="post" action="{{ url_for('signup') }}" class="signup-form">
        <input class="signup-input" type="text" id="fullname" name="fullname" placeholder="Full name" required />
        <input class="signup-input" type="text" id="username" name="username" placeholder="Username" required />
        <input class="signup-input" type="password" id="password" name="password" placeholder="Password" required />

        <div class="action-box">
          <div class="actions">
            <input class="signup-submit" type="submit" value="Sign Up" />
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
