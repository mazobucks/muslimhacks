{% extends 'caregiver_base.html' %}
{% block title %}Add Elder{% endblock %}

{% block content %}
<style>
  body.add-elder-page {
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(145deg, rgb(12, 12, 24), rgb(31, 31, 43));
  }

  .add-elder-container {
    width: min(100%, 560px);
    margin: 2rem auto;
    padding: 2rem;
    background: rgba(24, 24, 36, 0.88);
    border: 1px solid rgb(70, 70, 85);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .add-elder-title {
    margin: 0 0 1.5rem;
    text-align: center;
    color: rgb(195, 145, 245);
    font-size: clamp(1.9rem, 3vw, 2.6rem);
  }

  .add-elder-form {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .add-elder-form label {
    color: white;
    font-weight: 600;
    font-size: 1rem;
  }

  .add-elder-form input {
    width: 100%;
    min-height: 3rem;
    padding: 0.8rem 0.9rem;
    border: 1px solid rgb(105, 105, 125);
    border-radius: 8px;
    background: rgb(12, 12, 24);
    color: white;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }

  .add-elder-form input:focus {
    outline: none;
    border-color: rgb(195, 145, 245);
    box-shadow: 0 0 0 3px rgba(155, 80, 226, 0.18);
  }

  .form-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    margin-top: 1.5rem;
  }

  .add-elder-form .btn-cancel,
  .add-elder-form .btn-submit {
    display: inline-block;
    min-width: 140px;
    padding: 0.8rem 1.4rem;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    border: none;
    transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease, color 150ms ease;
    text-align: center;
  }

  .add-elder-form .btn-submit {
    background-color: rgb(155, 80, 226);
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(5, 8, 12, 0.35);
  }

  .add-elder-form .btn-submit:hover {
    transform: translateY(-2px);
    background-color: rgb(175, 105, 238);
    box-shadow: 0 10px 28px rgba(5, 8, 12, 0.45);
  }

  .add-elder-form .btn-cancel {
    background: transparent;
    color: rgb(195, 145, 245);
    border: 1px solid rgb(105, 105, 125);
  }

  .add-elder-form .btn-cancel:hover {
    transform: translateY(-1px);
    background: rgb(31, 31, 43);
    color: white;
  }

  .flashes {
    list-style: none;
    padding: 0;
    margin: 0 0 1.25rem;
  }

  .flashes li {
    padding: 0.85rem 1rem;
    margin-bottom: 0.75rem;
    background-color: rgba(154, 42, 63, 0.18);
    color: rgb(255, 216, 222);
    border: 1px solid rgba(255, 116, 136, 0.4);
    border-left: 4px solid rgb(255, 116, 136);
    border-radius: 8px;
  }

  @media (max-width: 520px) {
    .add-elder-container {
      padding: 1.25rem;
    }

    .form-actions {
      flex-direction: column;
    }

    .add-elder-form .btn-cancel,
    .add-elder-form .btn-submit {
      width: 100%;
    }
  }
</style>

<div class="add-elder-container">
  <h2 class="add-elder-title">Add Elder</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flashes">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="post" action="{{ url_for('add_elder') }}" enctype="multipart/form-data" class="add-elder-form">
    <div class="form-group">
      <label for="full_name">Full name</label>
      <input type="text" id="full_name" name="full_name" required>
    </div>

    <div class="form-group">
      <label for="username">Username (for the elder's login)</label>
      <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div class="form-group">
      <label for="language">Language</label>
      <input type="text" id="language" name="language" value="English" required>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('caregiver') }}" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-submit">Add elder</button>
    </div>
  </form>
</div>
{% endblock %}
