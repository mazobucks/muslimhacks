<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f3f8ff, #e8f3ea);
            font-family: Arial, sans-serif;
            color: #1e2a38;
        }
        .container {
            width: min(90%, 700px);
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            margin: 0 0 15px;
            font-size: clamp(2rem, 5vw, 3rem);
        }
        p {
            margin: 0 0 30px;
            font-size: 1.1rem;
            color: #4a5b6b;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            min-width: 180px;
            padding: 16px 26px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .btn-primary {
            background: #1e7f5b;
            color: white;
        }
        .btn-secondary {
            background: #eaf1ff;
            color: #1d3557;
        }
        .small-text {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #596d80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <p>Login as an elder or caregiver, or sign up as a primary caregiver.</p>

        <div class="actions">
            <a href="{{ url_for('signup') }}" class="btn btn-primary">Sign Up</a>
            <a href="{{ url_for('login') }}" class="btn btn-secondary">Login</a>
        </div>
    </div>
</body>
</html>
