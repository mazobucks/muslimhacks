<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>
    <main class="welcome-page">
        <section class="welcome-panel" aria-labelledby="welcome-title">
            <div class="brand-mark">
                <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Connect and Care logo">
            </div>
            <p class="welcome-label">Connect and Care</p>
            <h1 id="welcome-title">Welcome</h1>
            <p class="welcome-message">A simple, caring place to manage daily support, medication, and prayer reminders.</p>

            <div class="actions" aria-label="Account actions">
                <a href="{{ url_for('login') }}" class="welcome-button welcome-button-primary">Log in</a>
                <a href="{{ url_for('signup') }}" class="welcome-button welcome-button-secondary">Sign up as a caregiver</a>
            </div>

            <p class="welcome-help">Choose an option to get started.</p>
        </section>
    </main>
</body>
</html>
