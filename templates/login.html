<html>

<head>
    <title>Login</title>
</head>

<body>
    {% for message in get_flashed_messages() %}
    <div class="error">There was an error: {{ message }}</div>
    {% endfor %}
    <h1>Log in your c&c account</h1>
        <form method="post">
            <input name="username" placeholder="Username" />
            <input name="password" placeholder="password" />
            <input type="submit"/>
        </form>
</body>

</html>
