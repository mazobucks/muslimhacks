<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <style>
        body.login-page {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: min(100%, 420px);
            margin: 0 auto;
            text-align: center;
        }

        .login-form .login-submit {
            display: inline-block;
            min-width: 120px;
            text-align: center;
            margin: 0.25rem;
            transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease, color 150ms ease;
            color: #ffffff !important;
            background-color: rgb(155, 80, 226);
            border: 1px solid #8b9aa9;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(5,8,12,0.4);
            cursor: pointer;
            font: inherit;
            text-decoration: none;
            line-height: normal;
            appearance: none;
            -webkit-appearance: none;
        }

        .login-form .login-submit:hover {
            transform: translateY(-4px);
            background-color: #4b5e6c;
            border-color: #394c56;
            box-shadow: 0 10px 28px rgba(5,8,12,0.6);
            color: #ffffff !important;
        }
    </style>
</head>

<body class="login-page">
    {% for message in get_flashed_messages() %}
    <div class="error">There was an error: {{ message }}</div>
    {% endfor %}
    <div class="login-container">
        <h1 class="login-title">Log in your c&c account</h1>
        <form method="post" class="login-form">
            <input class="login-input" name="username" placeholder="Username" />
            <input class="login-input" name="password" placeholder="Password" type="password" />
            
            <div class="action-box">
                <div class="actions">
                    <input class="login-submit btn btn-secondary" type="submit" value="Log In" />
                </div>
            </div>
        </form>
    </div>
</body>

</html>
